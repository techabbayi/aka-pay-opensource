
services:
  - type: web
    name: aka-pay-demo
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node scripts/start-render-demo.js
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 24.22.1

      - key: NODE_ENV
        value: production

      - key: AKAPAY_BIND_HOST
        value: 0.0.0.0

      - key: YOUPI_BIND_HOST
        value: 0.0.0.0

      - key: USE_SQLITE_FALLBACK
        value: "true"

      - key: ENCRYPTION_MASTER_KEY
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: AKAPAY_ALLOW_DEV_TOOLS
        value: "false"

      - key: YOUPI_ALLOW_DEV_TOOLS
        value: "false"

      - key: AKAPAY_EXPOSE_DEV_OTP
        value: "false"

      - key: YOUPI_EXPOSE_DEV_OTP
        value: "false"
